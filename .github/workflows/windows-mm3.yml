# Builds the Windows Qt/SDL version of FCEUX (the same steps as pipelines/qwin64_build.bat) on GitHub's servers.
# Not tested by the author of this patch: if a step fails, the log shows which one.
name: Windows (Qt) build

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build FCEUX
        shell: cmd
        env:
          QT_ENV_LOADED: preinstalled
        run: pipelines\qwin64_build.bat

      - name: Add the MM3 album folder skeleton
        shell: cmd
        run: xcopy /E /I /Y output\mm3_remade build\bin\mm3_remade

      - uses: actions/upload-artifact@v4
        with:
          name: fceux-mm3-windows
          path: build/bin
          if-no-files-found: error

      - name: Publish the build as split files on the build-output branch
        shell: bash
        run: |
          mkdir out && cd out
          7z a -tzip fceux-mm3-windows.zip ../build/bin/* > /dev/null
          split -b 40m -d fceux-mm3-windows.zip fceux-mm3-windows.zip.part
          rm fceux-mm3-windows.zip
          sha256sum * > SHA256SUMS.txt
          git init -q -b build-output
          git config user.name "build"; git config user.email "build@example.com"
          git add -A; git commit -q -m "Windows build $GITHUB_SHA"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin build-output
